name: Delete All Branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPOSITORY/branches?per_page=100"             --jq '.[].name' |
          while IFS= read -r branch; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi

            encoded_branch=$(jq -rn --arg branch "$branch" '$branch | @uri')
            echo "Deleting branch: $branch"
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$encoded_branch"
          done
