name: Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: 'TextRelay_Local_2026!'
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sms -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20 --health-start-period=10s
    env:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: 'TextRelay_Local_2026!'
      SMS_TEST_POSTGRES: 'Host=localhost;Port=5432;Database=sms_api_webhook_tests;Username=sms;Password=TextRelay_Local_2026!'
      SMS_TEST_REPORTING_POSTGRES: 'Host=localhost;Port=5432;Database=sms_api_reporting_tests;Username=sms;Password=TextRelay_Local_2026!'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Initialize canonical schemas
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U sms sms_api_webhook_tests
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U sms -d sms_api_webhook_tests < database/schema.sql
          docker exec "$POSTGRES_CONTAINER" createdb -U sms sms_api_reporting_tests
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U sms -d sms_api_reporting_tests < database/reporting-schema.sql
      - name: Verify webhook and administration persistence against PostgreSQL
        run: dotnet test TextRelay.Api.sln --configuration Release --filter 'Category=Integration'

  compose-integration:
    name: Docker Compose end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Initialize databases through Docker Compose
        run: docker compose run --build --rm provider-init
      - name: Verify schemas, the example client, and encrypted providers
        run: |
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U sms -d sms_api <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.smsmessages') IS NULL THEN RAISE EXCEPTION 'Application schema is missing.'; END IF;
            IF to_regclass('public.alertrules') IS NULL THEN RAISE EXCEPTION 'Alert rules schema is missing.'; END IF;
            IF to_regclass('public.alerts') IS NULL THEN RAISE EXCEPTION 'Alerts schema is missing.'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM PortalUsers
              WHERE Username='platform' AND Context='platform' AND Role='administrator' AND TenantId IS NULL AND IsActive
                AND octet_length(PasswordHash)=32 AND octet_length(PasswordSalt)=32
                AND PasswordIterations=600000
            ) THEN RAISE EXCEPTION 'Initial administrator is missing or password hashing is invalid.'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM ApiClients c
              JOIN Tenants t ON t.Id=c.TenantId
              WHERE c.ClientId='client' AND c.IsActive AND t.IsActive
            ) THEN RAISE EXCEPTION 'Example tenant/client is missing.'; END IF;
            IF (SELECT COUNT(*) FROM TenantSmsProviders
                WHERE TenantId='11111111-1111-4111-8111-111111111111'
                  AND Provider IN ('Twilio','Bandwidth') AND IsActive) <> 2
              THEN RAISE EXCEPTION 'Example providers are missing.'; END IF;
            IF (SELECT COUNT(*) FROM TenantSmsProviders
                WHERE TenantId='11111111-1111-4111-8111-111111111111' AND IsDefault) <> 1
              THEN RAISE EXCEPTION 'Expected one default provider.'; END IF;
            IF EXISTS (SELECT 1 FROM TenantSmsProviders WHERE ApiSecret LIKE 'fake-%' OR Settings LIKE '%webhookPassword%')
              THEN RAISE EXCEPTION 'Provider secrets must be encrypted.'; END IF;
          END $$;
          SQL
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U sms -d sms_api_logs <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.useractivitylogs') IS NULL THEN RAISE EXCEPTION 'User activity schema is missing.'; END IF;
            IF to_regclass('public.systemlogs') IS NULL THEN RAISE EXCEPTION 'System log schema is missing.'; END IF;
          END $$;
          SQL
      - name: Start application stack
        run: docker compose up -d --build haproxy
      - name: Verify administrator password login and tenant separation over HTTP
        run: python3 tests/e2e/auth_and_tenant_isolation.py
      - name: Show resource diagnostics
        if: failure()
        run: |
          free -h
          df -h
          docker stats --no-stream || true

      - name: Show initialization logs
        if: failure()
        run: docker compose logs postgres db-init provider-init rabbitmq-1 rabbitmq-2 rabbitmq-3 rabbitmq-lb redis clickstack otel-collector api-1 api-2 haproxy
      - name: Clean up
        if: always()
        run: docker compose down --remove-orphans --volumes
