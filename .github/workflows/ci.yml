name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Sms.Api.sln
      - name: Build
        run: dotnet build Sms.Api.sln --configuration Release --no-restore
      - name: Test with coverage
        run: dotnet test Sms.Api.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults
      - name: Verify coverage report
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path ./TestResults -Filter coverage.cobertura.xml -Recurse
          if ($files.Count -eq 0) { throw "No coverage report was generated." }
          $rates = foreach ($file in $files) {
            [xml]$coverage = Get-Content $file.FullName
            [double]$coverage.coverage.'line-rate'
          }
          $lineRate = ($rates | Measure-Object -Minimum).Minimum
          $percent = [math]::Round($lineRate * 100, 2)
          Write-Host "Minimum line coverage: $percent%"
          if ($percent -lt 80) { throw "Line coverage $percent% is below the required 80%." }
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  frontend-quality:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Run frontend unit tests
        run: npm test

