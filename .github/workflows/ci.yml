name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Sms.Api.sln
      - name: Build
        run: dotnet build Sms.Api.sln --configuration Release --no-restore
      - name: Test with coverage
        run: dotnet test Sms.Api.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults
      - name: Verify coverage report
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path ./TestResults -Filter coverage.cobertura.xml -Recurse
          if ($files.Count -eq 0) { throw "No coverage report was generated." }
          $rates = foreach ($file in $files) {
            [xml]$coverage = Get-Content $file.FullName
            [double]$coverage.coverage.'line-rate'
          }
          $lineRate = ($rates | Measure-Object -Minimum).Minimum
          $percent = [math]::Round($lineRate * 100, 2)
          Write-Host "Minimum line coverage: $percent%"
          if ($percent -lt 80) { throw "Line coverage $percent% is below the required 80%." }
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  bandwidth-sql:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'SmsApi_Local_2026!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SmsApi_Local_2026!' -C -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=20 --health-start-period=20s
    env:
      SMS_TEST_SQLSERVER: 'Server=localhost;Database=SmsApiWebhookTests;User Id=sa;Password=SmsApi_Local_2026!;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Initialize canonical schema
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SmsApi_Local_2026!' -C -I -b -Q 'CREATE DATABASE SmsApiWebhookTests;'
          docker exec -i "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SmsApi_Local_2026!' -C -I -b -d SmsApiWebhookTests < database/schema.sql
      - name: Verify webhook and administration persistence against SQL Server
        run: dotnet test Sms.Api.sln --configuration Release --filter 'FullyQualifiedName~BandwidthWebhookSqlTests|FullyQualifiedName~AdministrationSqlTests'

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  compose-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Initialize databases through Docker Compose
        run: docker compose run --rm db-init
      - name: Verify both schemas and the example client
        run: |
          docker compose exec -T sqlserver bash -c 'export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"; exec /opt/mssql-tools18/bin/sqlcmd -S tcp:localhost,1433 -U sa -C -b -d master' <<'SQL'
          IF OBJECT_ID(N'SmsApi.dbo.SmsMessages', N'U') IS NULL THROW 50000, 'Application schema is missing.', 1;
          IF OBJECT_ID(N'SmsApiLogs.dbo.LogEntries', N'U') IS NULL THROW 50000, 'Observability schema is missing.', 1;
          IF NOT EXISTS (SELECT 1 FROM SmsApi.dbo.ApiClients c JOIN SmsApi.dbo.Tenants t ON t.Id = c.TenantId WHERE c.ClientId = N'example-client' AND c.IsActive = 1 AND t.IsActive = 1) THROW 50000, 'Example tenant/client is missing.', 1;
          GO
          SQL
      - name: Show initialization logs
        if: failure()
        run: docker compose logs sqlserver db-init
      - name: Clean up
        if: always()
        run: docker compose down --remove-orphans
