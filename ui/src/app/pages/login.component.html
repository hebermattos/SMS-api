<main class="signin">
  <section class="signin-panel" aria-labelledby="signin-title">
    <div class="signin-form-wrap">
      <a class="brand" href="/login" aria-label="SMS UI home">SMS<span class="brand-light">ui</span></a>
      <span class="eyebrow">WELCOME BACK</span>
      <h2 id="signin-title">Sign in to your workspace</h2>
      <p class="signin-subtitle">Your messages and activity, all in one place.</p>
      <div class="signin-modes" role="group" aria-label="Account type">
        <button type="button" [class.active]="mode() === 'client'" [disabled]="busy()" (click)="changeMode('client')">Client</button>
        <button type="button" [class.active]="mode() === 'platform'" [disabled]="busy()" (click)="changeMode('platform')">Platform</button>
      </div>
      @if (error()) { <div class="signin-notice signin-error" role="alert"><sms-icon name="alert"/><span>{{ error() }}</span></div> }
      <form #form="ngForm" (ngSubmit)="submit()" [attr.aria-busy]="busy()" novalidate>
        <label for="login-identity">{{ mode() === 'client' ? 'Client ID' : 'Username' }}</label>
        @if (mode() === 'client') {
          <input id="login-identity" name="clientId" [(ngModel)]="clientId" autocomplete="username"
            autocapitalize="none" spellcheck="false" required maxlength="100"
            placeholder="Enter your client ID" [readOnly]="busy()"/>
        } @else {
          <input id="login-identity" name="username" [(ngModel)]="username" autocomplete="username"
            autocapitalize="none" spellcheck="false" required maxlength="100"
            placeholder="Enter your platform username" [readOnly]="busy()"/>
        }
        <label for="credential">{{ mode() === 'client' ? 'Client secret' : 'Password' }}</label>
        <div class="signin-password">
          <input id="credential" name="credential" [type]="showCredential() ? 'text' : 'password'"
            [(ngModel)]="credential" autocomplete="current-password" required
            [maxlength]="mode() === 'client' ? 1024 : 128" [readOnly]="busy()"
            (keydown)="checkCapsLock($event)" (keyup)="checkCapsLock($event)"
            (blur)="capsLock.set(false)"/>
          <button type="button" class="signin-reveal" [disabled]="busy()"
            (click)="showCredential.set(!showCredential())">
            {{ showCredential() ? 'Hide' : 'Show' }}
          </button>
        </div>
        @if (capsLock()) { <p class="signin-caps">Caps Lock is on.</p> }
        <button class="signin-submit" type="submit" [disabled]="form.invalid || busy()">
          {{ busy() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>
      <p class="signin-session-note">Sign out when using a shared device.</p>
    </div>
  </section>
</main>
