global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend sms_api
    bind *:8080
    default_backend sms_api_servers

backend sms_api_servers
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    server api1 api-1:8080 check inter 5s fall 3 rise 2
    server api2 api-2:8080 check inter 5s fall 3 rise 2
