<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style>
.title{font:700 36px Arial,sans-serif;fill:#102a56}.sub{font:20px Arial,sans-serif;fill:#64748b}.h{font:700 20px Arial,sans-serif;fill:#102a56}.t{font:700 18px Arial,sans-serif;fill:#102a56}.s{font:15px Arial,sans-serif;fill:#334155}.mini{font:13px Arial,sans-serif;fill:#475569}.box{rx:12;ry:12;stroke-width:2}.group{rx:12;ry:12;fill:#fff;stroke:#64748b;stroke-width:1.5;stroke-dasharray:8 7}.line{stroke:#102a56;stroke-width:2.3;fill:none;marker-end:url(#a)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#g)}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#102a56"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1600" height="1000" fill="#fff"/><text x="800" y="50" text-anchor="middle" class="title">SMS API – Docker Compose Architecture</text><text x="800" y="82" text-anchor="middle" class="sub">Local development environment with all required services</text>
<rect x="30" y="130" width="270" height="135" fill="#eef6ff" stroke="#1683e8" class="box"/><text x="165" y="175" text-anchor="middle" class="h">Web UI</text><text x="165" y="202" text-anchor="middle" class="s">Angular + Nginx</text><text x="165" y="235" text-anchor="middle" class="s">http://localhost:4200</text>
<rect x="565" y="125" width="355" height="145" fill="#eef6ff" stroke="#1683e8" class="box"/><text x="742" y="170" text-anchor="middle" class="h">SMS API</text><text x="742" y="198" text-anchor="middle" class="s">ASP.NET Core / .NET 8</text><text x="742" y="232" text-anchor="middle" class="s">http://localhost:8080</text>
<path d="M300 197H565" class="line"/><text x="432" y="182" text-anchor="middle" class="mini">HTTP (REST + JWT)</text>
<rect x="1180" y="105" width="380" height="225" class="group"/><text x="1370" y="137" text-anchor="middle" class="h">External SMS Providers</text><rect x="1210" y="160" width="320" height="62" fill="#fff" stroke="#aaa" class="box"/><text x="1370" y="198" text-anchor="middle" class="t">Twilio</text><rect x="1210" y="240" width="320" height="62" fill="#fff" stroke="#aaa" class="box"/><text x="1370" y="278" text-anchor="middle" class="t">Bandwidth</text><path d="M920 170H1210" class="line"/><text x="1065" y="155" text-anchor="middle" class="mini">Send SMS</text><path d="M1210 272H1080V220H920" class="line"/><text x="1050" y="250" text-anchor="middle" class="mini">Receive webhooks</text>
<rect x="75" y="350" width="225" height="125" fill="#f7f1ff" stroke="#8b5cf6" class="box"/><text x="187" y="390" text-anchor="middle" class="h">Ollama</text><text x="187" y="418" text-anchor="middle" class="s">Qwen2.5 0.5B</text><text x="187" y="444" text-anchor="middle" class="mini">Local message assistant</text><path d="M640 270V315H187V350" class="line"/>
<rect x="360" y="350" width="225" height="125" fill="#effdf3" stroke="#16a34a" class="box"/><text x="472" y="397" text-anchor="middle" class="h">Redis</text><text x="472" y="425" text-anchor="middle" class="s">Cache</text><text x="472" y="455" text-anchor="middle" class="s">localhost:6379</text>
<rect x="625" y="350" width="225" height="125" fill="#fff8e7" stroke="#f59e0b" class="box"/><text x="737" y="397" text-anchor="middle" class="h">RabbitMQ</text><text x="737" y="425" text-anchor="middle" class="s">Messaging</text><text x="737" y="455" text-anchor="middle" class="s">localhost:5672</text>
<rect x="900" y="350" width="280" height="125" fill="#fff0f2" stroke="#ef476f" class="box"/><text x="1040" y="397" text-anchor="middle" class="h">PostgreSQL 17</text><text x="1040" y="425" text-anchor="middle" class="s">Database server</text><text x="1040" y="455" text-anchor="middle" class="s">localhost:5432</text>
<path d="M690 270V310H472V350" class="line"/><path d="M742 270V350" class="line"/><path d="M800 270V310H1040V350" class="line"/>
<rect x="1210" y="350" width="170" height="125" fill="#f6efff" stroke="#7c3aed" class="box"/><text x="1295" y="382" text-anchor="middle" class="h">OTel Collector</text><text x="1295" y="409" text-anchor="middle" class="s">Standalone mode</text><text x="1295" y="434" text-anchor="middle" class="mini">Internal OTLP :4318</text><text x="1295" y="457" text-anchor="middle" class="mini">Not exposed to host</text><rect x="1390" y="350" width="170" height="125" fill="#f6efff" stroke="#7c3aed" class="box"/><text x="1475" y="382" text-anchor="middle" class="h">ClickStack + Auth</text><text x="1475" y="409" text-anchor="middle" class="s">HyperDX via Caddy</text><text x="1475" y="434" text-anchor="middle" class="mini">UI :8081 · Basic Auth</text><text x="1475" y="457" text-anchor="middle" class="mini">ClickHouse :18123</text><path d="M820 270V320H1295V350" class="line"/><text x="1080" y="308" text-anchor="middle" class="mini">OpenTelemetry OTLP/HTTP</text><path d="M1380 412H1390" class="line"/>
<rect x="30" y="510" width="500" height="250" class="group"/><text x="50" y="542" class="h">Initialization</text><rect x="50" y="565" width="215" height="165" fill="#f1fbff" stroke="#38bdf8" class="box"/><text x="157" y="605" text-anchor="middle" class="t">db-init</text><text x="157" y="635" text-anchor="middle" class="s">Creates databases,</text><text x="157" y="657" text-anchor="middle" class="s">schemas and sample tenant</text><text x="157" y="700" text-anchor="middle" class="mini">Runs after PostgreSQL is healthy</text><rect x="285" y="565" width="220" height="165" fill="#f7f1ff" stroke="#8b5cf6" class="box"/><text x="395" y="605" text-anchor="middle" class="t">provider-init</text><text x="395" y="635" text-anchor="middle" class="s">Configures platform admin</text><text x="395" y="657" text-anchor="middle" class="s">and initial SMS providers</text><text x="395" y="700" text-anchor="middle" class="mini">Runs after db-init</text>
<rect x="565" y="510" width="615" height="250" class="group"/><text x="585" y="542" class="h">PostgreSQL Databases</text><rect x="595" y="585" width="165" height="120" fill="#eef5ff" stroke="#2563eb" class="box"/><text x="677" y="625" text-anchor="middle" class="t">sms_api</text><text x="677" y="652" text-anchor="middle" class="mini">Application data</text><rect x="785" y="585" width="165" height="120" fill="#f6efff" stroke="#7c3aed" class="box"/><text x="867" y="625" text-anchor="middle" class="t">sms_api_logs</text><text x="867" y="652" text-anchor="middle" class="mini">Audit + error logs</text><rect x="975" y="585" width="175" height="120" fill="#effcf3" stroke="#16a34a" class="box"/><text x="1062" y="625" text-anchor="middle" class="t">sms_api_reporting</text><text x="1062" y="652" text-anchor="middle" class="mini">Reports and aggregates</text><path d="M1040 475V540H677V585" class="line"/><path d="M1040 540H867V585" class="line"/><path d="M1040 540H1062V585" class="line"/><text x="855" y="565" text-anchor="middle" class="mini">activity + errors</text>
<path d="M265 645H285" class="dash"/><path d="M530 645H595" class="dash"/>
<rect x="30" y="795" width="335" height="160" class="group"/><text x="50" y="827" class="h">Optional</text><rect x="55" y="850" width="285" height="80" fill="#fff0f2" stroke="#ef476f" class="box"/><text x="197" y="882" text-anchor="middle" class="t">webhook-tests</text><text x="197" y="908" text-anchor="middle" class="mini">Docker profile: tests</text>
<rect x="390" y="795" width="300" height="160" class="group"/><text x="410" y="827" class="h">Automatic Backup</text><rect x="415" y="850" width="250" height="80" fill="#f7f1ff" stroke="#8b5cf6" class="box"/><text x="540" y="880" text-anchor="middle" class="t">postgres-backup</text><text x="540" y="904" text-anchor="middle" class="mini">pg_dump · every 24h · keep 7 days</text><path d="M677 705V770H540V850" class="line"/>
<rect x="715" y="795" width="465" height="160" class="group"/><text x="735" y="827" class="h">Persistent Storage</text><rect x="740" y="850" width="415" height="80" fill="#f8fafc" stroke="#64748b" class="box"/><text x="947" y="878" text-anchor="middle" class="t">Persistent Docker volumes</text><text x="947" y="900" text-anchor="middle" class="mini">postgres-data · postgres-backups · clickstack-data · ollama-data</text><path d="M1040 475V780H830V850" class="dash"/><path d="M1475 475V780H1070V850" class="dash"/><path d="M665 890H740" class="line"/><path d="M187 475V770H770V850" class="dash"/>
<rect x="1210" y="510" width="350" height="390" class="group"/><text x="1230" y="542" class="h">Legend</text><rect x="1240" y="575" width="28" height="20" fill="#eef6ff" stroke="#1683e8"/><text x="1285" y="591" class="s">Application service</text><rect x="1240" y="615" width="28" height="20" fill="#effdf3" stroke="#16a34a"/><text x="1285" y="631" class="s">Cache</text><rect x="1240" y="655" width="28" height="20" fill="#fff8e7" stroke="#f59e0b"/><text x="1285" y="671" class="s">Message broker</text><rect x="1240" y="695" width="28" height="20" fill="#fff0f2" stroke="#ef476f"/><text x="1285" y="711" class="s">Database service</text><rect x="1240" y="735" width="28" height="20" fill="#f7f1ff" stroke="#8b5cf6"/><text x="1285" y="751" class="s">Initialization / tools / AI</text><line x1="1240" y1="800" x2="1290" y2="800" class="line"/><text x="1310" y="806" class="s">Service connection</text><line x1="1240" y1="845" x2="1290" y2="845" class="dash"/><text x="1310" y="851" class="s">Initialization flow</text>
