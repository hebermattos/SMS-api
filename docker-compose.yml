services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-sms}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-sms}"
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-SmsApi_Local_2026!}"
    ports: ["1434:1433"]
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database:/database:ro
    environment:
      SQLCMDPASSWORD: "${SQL_SA_PASSWORD:-SmsApi_Local_2026!}"
    entrypoint: ["/bin/bash","-c"]
    command:
      - |
        set -euo pipefail
        sqlcmd="/opt/mssql-tools18/bin/sqlcmd"
        database_exists() {
          local database="$$1"
          local result
          result="$$("$$sqlcmd" -I -b -C -S tcp:sqlserver,1433 -U sa -d master -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN DB_ID(N'$$database') IS NULL THEN 0 ELSE 1 END;")"
          result="$$(printf '%s' "$$result" | tr -d '[:space:]')"
          [ "$$result" = "1" ]
        }

        if ! database_exists "SmsApi"; then
          "$$sqlcmd" -I -b -C -S tcp:sqlserver,1433 -U sa -d master -Q "CREATE DATABASE [SmsApi];"
          "$$sqlcmd" -I -b -C -S tcp:sqlserver,1433 -U sa -d SmsApi -i /database/schema.sql
          "$$sqlcmd" -I -b -C -S tcp:sqlserver,1433 -U sa -d SmsApi -i /database/seeds/example_tenant.sql
        fi

        if ! database_exists "SmsApiLogs"; then
          "$$sqlcmd" -I -b -C -S tcp:sqlserver,1433 -U sa -d master -Q "CREATE DATABASE [SmsApiLogs];"
          "$$sqlcmd" -I -b -C -S tcp:sqlserver,1433 -U sa -d SmsApiLogs -i /database/logs-schema.sql
        fi

  provider-init:
    build:
      context: .
      dockerfile: database/seeds/Sms.Seed/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      Admin__Username: "${ADMIN_USERNAME:-platform}"
      Admin__Password: "${ADMIN_PASSWORD:-platform}"
      Admin__Email: "${ADMIN_EMAIL:-platform@example.com}"
      Admin__AllowInsecureBootstrapPassword: "true"
      ConnectionStrings__SqlServer: "Server=sqlserver;Database=SmsApi;User Id=sa;Password=${SQL_SA_PASSWORD:-SmsApi_Local_2026!};TrustServerCertificate=True"
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:-AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}"

  api:
    build:
      context: .
      dockerfile: src/Sms.Api/Dockerfile
    depends_on:
      provider-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__SqlServer: "Server=sqlserver;Database=SmsApi;User Id=sa;Password=${SQL_SA_PASSWORD:-SmsApi_Local_2026!};TrustServerCertificate=True"
      ConnectionStrings__LogsSqlServer: "Server=sqlserver;Database=SmsApiLogs;User Id=sa;Password=${SQL_SA_PASSWORD:-SmsApi_Local_2026!};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-local-development-jwt-key-change-me-1234567890}"
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:-AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}"
      Sms__PublicBaseUrl: "${SMS_PUBLIC_BASE_URL:-https://localhost:8080}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__User: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    ports: ["8080:8080"]

  webhook-tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: tests/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SMS_TEST_SQLSERVER: "Server=sqlserver;Database=SmsApi;User Id=sa;Password=${SQL_SA_PASSWORD:-SmsApi_Local_2026!};TrustServerCertificate=True"

  console:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports: ["4200:80"]

volumes:
  sqlserver-data:
