services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-SmsApi_Local_2026!}"
    ports: ["1434:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database:/database:ro
    environment:
      SQLCMDPASSWORD: "${SQL_SA_PASSWORD:-SmsApi_Local_2026!}"
    entrypoint: ["/bin/bash","-c"]
    command:
      - |
        /opt/mssql-tools18/bin/sqlcmd -I -b -C -S tcp:sqlserver,1433 -U sa -d master -Q "IF DB_ID(N'SmsApi') IS NOT NULL BEGIN ALTER DATABASE SmsApi SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE SmsApi; END;" &&
        /opt/mssql-tools18/bin/sqlcmd -I -b -C -S tcp:sqlserver,1433 -U sa -d master -Q "CREATE DATABASE SmsApi;" &&
        /opt/mssql-tools18/bin/sqlcmd -I -b -C -S tcp:sqlserver,1433 -U sa -d master -Q "IF DB_ID(N'SmsApiLogs') IS NOT NULL BEGIN ALTER DATABASE SmsApiLogs SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE SmsApiLogs; END;" &&
        /opt/mssql-tools18/bin/sqlcmd -I -b -C -S tcp:sqlserver,1433 -U sa -d master -Q "CREATE DATABASE SmsApiLogs;" &&
        /opt/mssql-tools18/bin/sqlcmd -I -b -C -S tcp:sqlserver,1433 -U sa -d SmsApi -i /database/schema.sql &&
        /opt/mssql-tools18/bin/sqlcmd -I -b -C -S tcp:sqlserver,1433 -U sa -d SmsApi -i /database/seeds/example_tenant.sql &&
        /opt/mssql-tools18/bin/sqlcmd -I -b -C -S tcp:sqlserver,1433 -U sa -d SmsApiLogs -i /database/logs-schema.sql

  provider-init:
    build:
      context: .
      dockerfile: database/seeds/Sms.Seed/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      Admin__Username: "${ADMIN_USERNAME:-admin}"
      Admin__Password: "${ADMIN_PASSWORD:-Admin_Local_2026!}"
      ConnectionStrings__SqlServer: "Server=sqlserver;Database=SmsApi;User Id=sa;Password=${SQL_SA_PASSWORD:-SmsApi_Local_2026!};TrustServerCertificate=True"
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:-AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}"

  api:
    build:
      context: .
      dockerfile: src/Sms.Api/Dockerfile
    depends_on:
      provider-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__SqlServer: "Server=sqlserver;Database=SmsApi;User Id=sa;Password=${SQL_SA_PASSWORD:-SmsApi_Local_2026!};TrustServerCertificate=True"
      ConnectionStrings__LogsSqlServer: "Server=sqlserver;Database=SmsApiLogs;User Id=sa;Password=${SQL_SA_PASSWORD:-SmsApi_Local_2026!};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-local-development-jwt-key-change-me-1234567890}"
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:-AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}"
      Admin__ProvisioningKey: "${ADMIN_PROVISIONING_KEY:-local-admin-key-change-me}"
      Sms__PublicBaseUrl: "${SMS_PUBLIC_BASE_URL:-https://localhost:8080}"
    ports: ["8080:8080"]

  webhook-tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: tests/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SMS_TEST_SQLSERVER: "Server=sqlserver;Database=SmsApi;User Id=sa;Password=${SQL_SA_PASSWORD:-SmsApi_Local_2026!};TrustServerCertificate=True"

  console:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports: ["4200:80"]
