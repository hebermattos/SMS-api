services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-SmsApi_Local_2026!}"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database:/database:ro
    entrypoint: ["/bin/bash","-c"]
    command: >
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "${SQL_SA_PASSWORD:-SmsApi_Local_2026!}" -Q "IF DB_ID(N'SmsApi') IS NOT NULL BEGIN ALTER DATABASE SmsApi SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE SmsApi; END; CREATE DATABASE SmsApi;" &&
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "${SQL_SA_PASSWORD:-SmsApi_Local_2026!}" -d SmsApi -i /database/schema.sql &&
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "${SQL_SA_PASSWORD:-SmsApi_Local_2026!}" -d SmsApi -i /database/seeds/example_tenant.sql

  api:
    build:
      context: .
      dockerfile: src/Sms.Api/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__SqlServer: "Server=sqlserver;Database=SmsApi;User Id=sa;Password=${SQL_SA_PASSWORD:-SmsApi_Local_2026!};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-local-development-jwt-key-change-me-1234567890}"
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:-AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}"
      Admin__ProvisioningKey: "${ADMIN_PROVISIONING_KEY:-local-admin-key-change-me}"
      Sms__PublicBaseUrl: "${SMS_PUBLIC_BASE_URL:-https://localhost:8080}"
    ports: ["8080:8080"]
