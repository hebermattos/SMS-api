services:
  rabbitmq:
    image: rabbitmq:3.13-management
    mem_reservation: 256m
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-sms}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-sms}"
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    mem_reservation: 64m
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickstack:
    image: docker.io/clickhouse/clickstack-all-in-one:2.21.0
    mem_reservation: 512m
    ports:
      - "8081:8080"
      - "4317:4317"
      - "4318:4318"
      - "18123:8123"
    volumes:
      - clickstack-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    mem_reservation: 128m
    mem_limit: 256m
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-sms}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-SmsApi_Local_2026!}"
      POSTGRES_DB: "postgres"
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db-init:
    image: postgres:17-alpine
    mem_reservation: 128m
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database:/database:ro
    environment:
      PGHOST: "postgres"
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:-sms}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-SmsApi_Local_2026!}"
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        set -eu
        database_exists() {
          [ "$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$1'")" = "1" ]
        }

        if ! database_exists "sms_api"; then
          createdb sms_api
          psql -v ON_ERROR_STOP=1 -d sms_api -f /database/schema.sql
        fi
        psql -v ON_ERROR_STOP=1 -d sms_api -f /database/refresh-tokens.sql
        psql -v ON_ERROR_STOP=1 -d sms_api -f /database/seeds/example_tenant.sql

        if ! database_exists "sms_api_logs"; then
          createdb sms_api_logs
          psql -v ON_ERROR_STOP=1 -d sms_api_logs -f /database/logs-schema.sql
        fi

        if ! database_exists "sms_api_reporting"; then
          createdb sms_api_reporting
          psql -v ON_ERROR_STOP=1 -d sms_api_reporting -f /database/reporting-schema.sql
        fi

  postgres-backup:
    image: postgres:17-alpine
    mem_reservation: 64m
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./database/backup.sh:/backup.sh:ro
      - postgres-backups:/backups
    environment:
      PGHOST: "postgres"
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:-sms}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-SmsApi_Local_2026!}"
      PGDATABASE: "sms_api"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped

  provider-init:
    mem_reservation: 128m
    build:
      context: .
      dockerfile: database/seeds/Sms.Seed/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      Admin__Username: "${ADMIN_USERNAME:-platform}"
      Admin__Password: "${ADMIN_PASSWORD:-platform}"
      Admin__Email: "${ADMIN_EMAIL:-platform@example.com}"
      Admin__AllowInsecureBootstrapPassword: "true"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sms_api;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-SmsApi_Local_2026!}"
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:-AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}"

  api:
    mem_reservation: 256m
    build:
      context: .
      dockerfile: src/Sms.Api/Dockerfile
    depends_on:
      provider-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickstack:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sms_api;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-SmsApi_Local_2026!}"
      ConnectionStrings__LogsPostgres: "Host=postgres;Port=5432;Database=sms_api_logs;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-SmsApi_Local_2026!}"
      ConnectionStrings__ReportingPostgres: "Host=postgres;Port=5432;Database=sms_api_reporting;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-SmsApi_Local_2026!}"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Enabled: "${CACHE_ENABLED:-true}"
      Jwt__Key: "${JWT_KEY:-local-development-jwt-key-change-me-1234567890}"
      Encryption__MasterKey: "${ENCRYPTION_MASTER_KEY:-AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=}"
      Sms__PublicBaseUrl: "${SMS_PUBLIC_BASE_URL:-https://localhost:8080}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__ManagementPort: "15672"
      RabbitMq__User: "${RABBITMQ_USER:-sms}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-sms}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://clickstack:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "sms-api"
    ports: ["8080:8080"]

  webhook-tests:
    profiles: [tests]
    mem_reservation: 256m
    build:
      context: .
      dockerfile: tests/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SMS_TEST_POSTGRES: "Host=postgres;Port=5432;Database=sms_api;Username=${POSTGRES_USER:-sms};Password=${POSTGRES_PASSWORD:-SmsApi_Local_2026!}"

  ui:
    mem_reservation: 32m
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports: ["4200:80"]

volumes:
  postgres-data:
  clickstack-data:
  postgres-backups:
